services:

  jobmanager:
    image: flink:1.19.1-scala_2.12-java11
    container_name: jobmanager

    ports:
      - "8081:8081"

    command: jobmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

    volumes:
      - ./sql:/opt/flink-sql
      - ./data:/opt/flink/data
      - ./output:/opt/flink/output


  taskmanager:
    image: flink:1.19.1-scala_2.12-java11
    container_name: taskmanager

    depends_on:
      - jobmanager

    command: taskmanager

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

    volumes:
      - ./data:/opt/flink/data
      - ./output:/opt/flink/output
